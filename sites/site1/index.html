<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site 1</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #e8f4f8 0%, #f7fafc 50%, #edf2f7 100%);
      color: #1a202c;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { margin: 0; opacity: 0.75; }
  </style>
</head>
<body>
  <main>
    <h1>Site 1</h1>
    <p>Azure Static Web Apps · Free tier demo</p>
  </main>
</body>
</html>
